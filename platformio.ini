; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; =============================================================================
; Base — shared across all environments
; =============================================================================
[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -D ARDUINO_USB_CDC_ON_BOOT=0
lib_deps =
	me-no-dev/ESPAsyncWebServer@^3.6.0
	mandulaj/PZEM-004T-v30@^1.1.2
	jgromes/RadioLib@^7.6.0
	bblanchon/ArduinoJson@^7.2.2
	esp32async/AsyncTCP@^3.4.10
	robtillaart/FRAM_I2C@^0.8.4

; =============================================================================
; Feature flag groups — compose these into envs below.
; These are NOT environments; PlatformIO ignores non-[env:*] sections
; unless explicitly referenced via ${...} interpolation.
; =============================================================================

; Fake PZEM sensor — replace hardware reads with simulated data (net testing)
[flags:nettest]
build_flags = -D PZEM_FAKE

; AES-128 CTR packet encryption + PN532 RFID key provisioning.
; Pins are defined in rfid_provision.cpp conditioned on NODE_GATEWAY / NODE_TELEMETRY.
[flags:encrypt]
build_flags = -D PKT_ENCRYPTION
lib_deps = adafruit/Adafruit PN532@^1.2.0

; GFSK bulk transport validation -- gateway only.
; Node echo support (typeTag 0xF0) is compiled into ALL node builds.
[flags:transport_test]
build_flags = -D TRANSPORT_TEST

; Interrupt-driven TDMA for STM32 single-core targets.
; Replaces the FreeRTOS polling loop with hardware timer (TIM2) slot sequencing
; and DIO0/DIO1 ISR event posting. Requires a physical wire from SX1278 DIO1
; to Black Pill PA1. Non-IRQ STM32 builds are unaffected.
[flags:irq_tdma]
build_flags = -D TDMA_IRQ_DRIVEN

; =============================================================================
; Environments — each is a combination of base + feature flags
;
; Provisioning flow for encrypted builds:
;   1. Flash gateway_enc  → auto-generates key on first boot (stored in NVS)
;   2. Web dashboard → "Write Key to Card" → tap MIFARE card to gateway PN532
;   3. Flash node_enc     → blinks red until card is tapped; stores key; reboots
; =============================================================================

[env:gateway]
extends = env
build_flags =
	${env.build_flags}
	-D NODE_GATEWAY
board_build.filesystem = littlefs
extra_scripts = pre:scripts/gzip_data.py

[env:gateway_enc]
extends = env:gateway
build_flags =
	${env:gateway.build_flags}
	${flags:encrypt.build_flags}
lib_deps =
	${env.lib_deps}
	${flags:encrypt.lib_deps}

[env:gateway_transport_test]
extends = env:gateway
build_flags =
	${env:gateway.build_flags}
	${flags:transport_test.build_flags}

[env:gateway_enc_transport_test]
extends = env:gateway_enc
build_flags =
	${env:gateway_enc.build_flags}
	${flags:transport_test.build_flags}

[env:node]
extends = env
build_flags =
	${env.build_flags}
	-D NODE_TELEMETRY

[env:node_enc]
extends = env:node
build_flags =
	${env:node.build_flags}
	${flags:encrypt.build_flags}
lib_deps =
	${env.lib_deps}
	${flags:encrypt.lib_deps}

[env:node_nettest]
extends = env:node
build_flags =
	${env:node.build_flags}
	${flags:nettest.build_flags}

[env:node_enc_nettest]
extends = env:node
build_flags =
	${env:node.build_flags}
	${flags:encrypt.build_flags}
	${flags:nettest.build_flags}
lib_deps =
	${env.lib_deps}
	${flags:encrypt.lib_deps}

; =============================================================================
; ESP32-S3 Super Mini node variants
; THT pins used: GPIO 1-13, TX (GPIO43), RX (GPIO44)
; Serial monitor runs over native USB CDC (ARDUINO_USB_CDC_ON_BOOT=1);
; UART2 is routed to GPIO43/44 for PZEM via the GPIO matrix.
; =============================================================================

[flags:s3_supermini]
build_flags =
	-D BOARD_S3_SUPERMINI
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D ARDUINO_USB_MODE=1

[env:node_s3]
extends = env:node
board = esp32s3_supermini
board_build.partitions = default.csv
upload_protocol = esp-builtin
debug_tool = esp-builtin
build_unflags = -D ARDUINO_USB_CDC_ON_BOOT=0
build_flags =
	${env:node.build_flags}
	${flags:s3_supermini.build_flags}

[env:node_s3_enc]
extends = env:node_s3
build_flags =
	${env:node_s3.build_flags}
	${flags:encrypt.build_flags}
lib_deps =
	${env.lib_deps}
	${flags:encrypt.lib_deps}

[env:node_s3_nettest]
extends = env:node_s3
build_flags =
	${env:node_s3.build_flags}
	${flags:nettest.build_flags}

[env:node_s3_enc_nettest]
extends = env:node_s3
build_flags =
	${env:node_s3.build_flags}
	${flags:encrypt.build_flags}
	${flags:nettest.build_flags}
lib_deps =
	${env.lib_deps}
	${flags:encrypt.lib_deps}

; =============================================================================
; STM32F411CEU6 WeAct Black Pill node variants
;
; Platform: ststm32 (ST Microelectronics STM32)
; Board:    blackpill_f411ce (512 KB flash, 128 KB SRAM, 168 MHz Cortex-M4)
;
; NVS storage uses flash sector 7 (0x08060000, 128 KB) -- reserved by the
; custom linker script.  FLASH region is therefore limited to 384 KB.
;
; FreeRTOS is provided by stm32duino/STM32duino FreeRTOS.
; The freertos/ compat shim (src/hal/stm32/compat/) redirects ESP-IDF-style
; <freertos/FreeRTOS.h> includes to <STM32FreeRTOS.h> without touching any
; existing source files.
;
; Gateway-specific files (gateway_*.cpp, fram_store.cpp) and the ESP32 HAL
; implementation (hal/esp32/*.cpp) are excluded via src_filter.
; =============================================================================

[stm32f411_node_base]
platform = ststm32
board = blackpill_f411ce
framework = arduino
monitor_speed = 115200
board_build.ldscript = src/hal/stm32/STM32F411CEUx_FLASH.ld
build_flags =
	-D NODE_TELEMETRY
	-D BOARD_STM32_F411
	-I src/hal/stm32/compat
src_filter =
	+<*.cpp>
	+<hal/stm32/*.cpp>
	-<hal/esp32/*.cpp>
	-<gateway_tdma_task.cpp>
	-<gateway_web.cpp>
	-<gateway_wifi_config.cpp>
	-<fram_store.cpp>
lib_deps =
	mandulaj/PZEM-004T-v30@^1.1.2
	jgromes/RadioLib@^7.6.0
	bblanchon/ArduinoJson@^7.2.2
	stm32duino/STM32duino FreeRTOS@^10.3.1

[env:node_stm32]
extends = stm32f411_node_base

[env:node_stm32_enc]
extends = stm32f411_node_base
build_flags =
	${stm32f411_node_base.build_flags}
	${flags:encrypt.build_flags}
lib_deps =
	${stm32f411_node_base.lib_deps}
	${flags:encrypt.lib_deps}

[env:node_stm32_nettest]
extends = stm32f411_node_base
build_flags =
	${stm32f411_node_base.build_flags}
	${flags:nettest.build_flags}

[env:node_stm32_enc_nettest]
extends = stm32f411_node_base
build_flags =
	${stm32f411_node_base.build_flags}
	${flags:encrypt.build_flags}
	${flags:nettest.build_flags}
lib_deps =
	${stm32f411_node_base.lib_deps}
	${flags:encrypt.lib_deps}

; =============================================================================
; STM32F411 interrupt-driven TDMA variants
;
; Same board and src_filter as the task-based STM32 envs above.
; TDMA_IRQ_DRIVEN activates node_irq_tdma.cpp and hal_timer_stm32.cpp
; (both guarded by preprocessor; no src_filter changes needed).
;
; Hardware prerequisite: wire SX1278 DIO1 pad to Black Pill PA1.
; =============================================================================

[env:node_stm32_irq]
extends = stm32f411_node_base
build_flags =
	${stm32f411_node_base.build_flags}
	${flags:irq_tdma.build_flags}

[env:node_stm32_enc_irq]
extends = stm32f411_node_base
build_flags =
	${stm32f411_node_base.build_flags}
	${flags:encrypt.build_flags}
	${flags:irq_tdma.build_flags}
lib_deps =
	${stm32f411_node_base.lib_deps}
	${flags:encrypt.lib_deps}

[env:node_stm32_nettest_irq]
extends = stm32f411_node_base
build_flags =
	${stm32f411_node_base.build_flags}
	${flags:nettest.build_flags}
	${flags:irq_tdma.build_flags}

[env:node_stm32_enc_nettest_irq]
extends = stm32f411_node_base
build_flags =
	${stm32f411_node_base.build_flags}
	${flags:encrypt.build_flags}
	${flags:nettest.build_flags}
	${flags:irq_tdma.build_flags}
lib_deps =
	${stm32f411_node_base.lib_deps}
	${flags:encrypt.lib_deps}
