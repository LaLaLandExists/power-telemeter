; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; =============================================================================
; Base — shared across all environments
; =============================================================================
[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -D ARDUINO_USB_CDC_ON_BOOT=0
lib_deps =
	me-no-dev/ESPAsyncWebServer@^3.6.0
	mandulaj/PZEM-004T-v30@^1.1.2
	jgromes/RadioLib@^7.6.0
	bblanchon/ArduinoJson@^7.2.2
	esp32async/AsyncTCP@^3.4.10
	robtillaart/FRAM_I2C@^0.8.4

; =============================================================================
; Feature flag groups — compose these into envs below.
; These are NOT environments; PlatformIO ignores non-[env:*] sections
; unless explicitly referenced via ${...} interpolation.
; =============================================================================

; Fake PZEM sensor — replace hardware reads with simulated data (net testing)
[flags:nettest]
build_flags = -D PZEM_FAKE

; AES-128 CTR packet encryption + PN532 RFID key provisioning.
; Pins are defined in rfid_provision.cpp conditioned on NODE_GATEWAY / NODE_TELEMETRY.
[flags:encrypt]
build_flags = -D PKT_ENCRYPTION
lib_deps = adafruit/Adafruit PN532@^1.2.0

; =============================================================================
; Environments — each is a combination of base + feature flags
;
; Provisioning flow for encrypted builds:
;   1. Flash gateway_enc  → auto-generates key on first boot (stored in NVS)
;   2. Web dashboard → "Write Key to Card" → tap MIFARE card to gateway PN532
;   3. Flash node_enc     → blinks red until card is tapped; stores key; reboots
; =============================================================================

[env:gateway]
extends = env
build_flags =
	${env.build_flags}
	-D NODE_GATEWAY
board_build.filesystem = littlefs
extra_scripts = scripts/gzip_data.py

[env:gateway_enc]
extends = env:gateway
build_flags =
	${env:gateway.build_flags}
	${flags:encrypt.build_flags}
lib_deps =
	${env.lib_deps}
	${flags:encrypt.lib_deps}

[env:node]
extends = env
build_flags =
	${env.build_flags}
	-D NODE_TELEMETRY

[env:node_enc]
extends = env:node
build_flags =
	${env:node.build_flags}
	${flags:encrypt.build_flags}
lib_deps =
	${env.lib_deps}
	${flags:encrypt.lib_deps}

[env:node_nettest]
extends = env:node
build_flags =
	${env:node.build_flags}
	${flags:nettest.build_flags}

[env:node_enc_nettest]
extends = env:node
build_flags =
	${env:node.build_flags}
	${flags:encrypt.build_flags}
	${flags:nettest.build_flags}
lib_deps =
	${env.lib_deps}
	${flags:encrypt.lib_deps}

; =============================================================================
; ESP32-S3 Super Mini node variants
; THT pins used: GPIO 1-13, TX (GPIO43), RX (GPIO44)
; Serial monitor runs over native USB CDC (ARDUINO_USB_CDC_ON_BOOT=1);
; UART2 is routed to GPIO43/44 for PZEM via the GPIO matrix.
; =============================================================================

[flags:s3_supermini]
build_flags =
	-D BOARD_S3_SUPERMINI
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D ARDUINO_USB_MODE=1

[env:node_s3]
extends = env:node
board = esp32s3_supermini
board_build.partitions = default.csv
upload_protocol = esp-builtin
debug_tool = esp-builtin
build_unflags = -D ARDUINO_USB_CDC_ON_BOOT=0
build_flags =
	${env:node.build_flags}
	${flags:s3_supermini.build_flags}

[env:node_s3_enc]
extends = env:node_s3
build_flags =
	${env:node_s3.build_flags}
	${flags:encrypt.build_flags}
lib_deps =
	${env.lib_deps}
	${flags:encrypt.lib_deps}

[env:node_s3_nettest]
extends = env:node_s3
build_flags =
	${env:node_s3.build_flags}
	${flags:nettest.build_flags}
